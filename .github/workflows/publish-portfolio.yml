name: Publish portfolio websites

on:
  push:
    branches: [portfolio-sites-2026]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout portfolio branch
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p published
          cp index.html vanta.html aera.html published/
          touch published/.nojekyll
      - name: Upload portfolio HTML
        uses: actions/upload-pages-artifact@v4
        with:
          path: published
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
