# NOVA AI developer preview only. Render Free Postgres expires after 30 days.
# Do NOT use this Blueprint for production or real customer purchases.
services:
  - type: web
    name: nova-ai-preview-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: nova-ai-preview-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: openrouter
      - key: AI_MODEL
        value: openrouter/free
      - key: OPENROUTER_API_KEY
        sync: false
      # Optional second independent free provider. Each Groq model has its own free quota.
      - key: GROQ_API_KEY
        sync: false
      - key: NOVA_PREMIUM_TOKENS_PER_MESSAGE
        value: "5"
      - key: NOVA_DEV_SCHEMA_SYNC
        value: "false"
databases:
  - name: nova-ai-preview-db
    plan: free
    region: frankfurt
    databaseName: nova
    user: nova
