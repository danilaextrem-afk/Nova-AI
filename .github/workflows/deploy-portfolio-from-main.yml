name: Publish VANTA and AERA Portfolio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-portfolio-from-main.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio source
        uses: actions/checkout@v4
        with:
          ref: portfolio-sites-2026
          persist-credentials: false
      - name: Prepare only public portfolio pages
        run: |
          mkdir -p published
          cp index.html vanta.html aera.html published/
          touch published/.nojekyll
          test -s published/index.html
          test -s published/vanta.html
          test -s published/aera.html
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: published

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published portfolio pages
        shell: bash
        run: |
          set -euo pipefail
          base="https://danilaextrem-afk.github.io/Nova-AI"
          for page in index.html vanta.html aera.html; do
            ok=0
            for attempt in $(seq 1 15); do
              if curl --location --fail --silent --show-error --max-time 12 "$base/$page" -o "/tmp/$page" && grep -qi '<html' "/tmp/$page"; then
                echo "PASS: $base/$page ($(wc -c < /tmp/$page) bytes)"
                ok=1
                break
              fi
              echo "Waiting for published $page (attempt $attempt)"
              sleep 5
            done
            test "$ok" -eq 1
          done
