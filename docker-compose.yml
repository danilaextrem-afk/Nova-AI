services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nova
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nova:${POSTGRES_PASSWORD}@postgres:5432/nova
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  backup:
    image: postgres:16
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do pg_dump -h postgres -U nova nova | gzip > /backups/nova-$$(date +%F).sql.gz; sleep 86400; done'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
