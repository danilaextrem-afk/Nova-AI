name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nova-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nova_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/nova_test
      JWT_SECRET: ci-only-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - name: Apply versioned Prisma migrations to isolated CI PostgreSQL
        run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      NOVA_API_BASE_URL: ${{ vars.NOVA_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect Android project
        id: android_check
        run: |
          if [ -f android/app/build.gradle.kts ]; then echo 'present=true' >> "$GITHUB_OUTPUT"; else echo 'present=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        if: steps.android_check.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK 36
        if: steps.android_check.outputs.present == 'true'
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.android_check.outputs.present == 'true'
        with:
          gradle-version: '8.13'
      - name: Assemble and test Android
        if: steps.android_check.outputs.present == 'true'
        run: cd android && gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: steps.android_check.outputs.present == 'true'
        with:
          name: NOVA-AI-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Assemble unsigned release candidates when owner signing key is absent
        if: env.KEYSTORE_B64 == ''
        run: cd android && gradle :app:bundleRelease :app:assembleRelease --no-daemon
      # Release signing uses repository secrets; skipped when they are absent.
      - name: Release AAB (signed only if secrets exist)
        if: steps.android_check.outputs.present == 'true' && env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd android
          gradle :app:bundleRelease :app:assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-release-candidates
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-results
          path: android/app/build/reports/tests

  android_ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cd android && gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
            adb pull /sdcard/Android/data/ai.nova.app/files/screenshots ../ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-evidence
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
            ui-screenshots

  source_archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source files
        run: git archive --format=zip --output=NOVA-AI-FINAL-SOURCE.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-FINAL-SOURCE
          path: NOVA-AI-FINAL-SOURCE.zip

  docker_image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the exact backend Docker image used by Render
        run: docker build --file backend/Dockerfile --tag nova-ai-preview:ci backend
