name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nova-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nova_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/nova_test
      JWT_SECRET: ci-only-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - name: Apply versioned Prisma migrations to isolated CI PostgreSQL
        run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      NOVA_API_BASE_URL: ${{ vars.NOVA_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect Android project
        id: android_check
        run: |
          if [ -f android/app/build.gradle.kts ]; then echo 'present=true' >> "$GITHUB_OUTPUT"; else echo 'present=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        if: steps.android_check.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK 36
        if: steps.android_check.outputs.present == 'true'
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.android_check.outputs.present == 'true'
        with:
          gradle-version: '8.13'
      - name: Assemble and test Android
        if: steps.android_check.outputs.present == 'true'
        run: cd android && gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: steps.android_check.outputs.present == 'true'
        with:
          name: NOVA-AI-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Assemble unsigned release candidates when owner signing key is absent
        if: env.KEYSTORE_B64 == ''
        run: cd android && gradle :app:bundleRelease :app:assembleRelease --no-daemon
      # Release signing uses repository secrets; skipped when they are absent.
      - name: Release AAB (signed only if secrets exist)
        if: steps.android_check.outputs.present == 'true' && env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd android
          gradle :app:bundleRelease :app:assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-release-candidates
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-results
          path: android/app/build/reports/tests

  android_ui:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used to publish screenshots to the ui-evidence branch below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cd android && gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || { adb pull /sdcard/Android/data/ai.nova.app/files/screenshots "$GITHUB_WORKSPACE/ui-screenshots"; exit 1; }
            adb pull /sdcard/Android/data/ai.nova.app/files/screenshots "$GITHUB_WORKSPACE/ui-screenshots"
            mkdir -p "$GITHUB_WORKSPACE/ui-standard-reports"
            cp -R "$GITHUB_WORKSPACE/android/app/build/reports/androidTests" "$GITHUB_WORKSPACE/ui-standard-reports/"
            adb shell wm size 480x800
            adb shell wm density 240
            cd "$GITHUB_WORKSPACE/android" && gradle :app:connectedDebugAndroidTest --rerun-tasks --no-daemon -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || { adb pull /sdcard/Android/data/ai.nova.app/files/screenshots "$GITHUB_WORKSPACE/ui-small-screenshots"; exit 1; }
            adb pull /sdcard/Android/data/ai.nova.app/files/screenshots "$GITHUB_WORKSPACE/ui-small-screenshots"
      # Artifacts cannot be downloaded from the development sandbox, so screenshots are also pushed to an
      # orphan 'ui-evidence' branch (images only, no code) for remote visual review.
      - name: Publish screenshots to the ui-evidence branch
        if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/nova/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ev && cd /tmp/ev && git init -q -b ui-evidence
          cp -R "$GITHUB_WORKSPACE/ui-screenshots" ./standard 2>/dev/null || true
          cp -R "$GITHUB_WORKSPACE/ui-small-screenshots" ./small 2>/dev/null || true
          echo "$GITHUB_SHA $GITHUB_REF_NAME" > SOURCE
          git add -A && git -c user.name=nova-ci -c user.email=nova-ci@users.noreply.github.com commit -qm "UI evidence ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ui-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-evidence
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
            ui-screenshots
            ui-standard-reports
            ui-small-screenshots

  source_archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source files
        run: git archive --format=zip --output=NOVA-AI-FULL-SOURCE.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-FULL-SOURCE
          path: NOVA-AI-FULL-SOURCE.zip

  docker_image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the exact backend Docker image used by Render
        run: docker build --file backend/Dockerfile --tag nova-ai-preview:ci backend
      - name: Run container, migrate fresh PostgreSQL, and restore a backup
        run: |
          docker network create nova-ci
          docker run -d --name nova-db --network nova-ci -e POSTGRES_PASSWORD=ci-only -e POSTGRES_DB=nova postgres:16
          for i in $(seq 1 30); do
            if docker exec nova-db pg_isready -U postgres; then break; fi
            sleep 2
          done
          docker run -d --name nova-api --network nova-ci -p 8080:8080 -e DATABASE_URL=postgresql://postgres:ci-only@nova-db:5432/nova -e JWT_SECRET=ci-only-long-container-test-secret-32-chars nova-ai-preview:ci
          ready=false
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/ready; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker logs nova-api; exit 1; fi
          curl --fail --silent http://localhost:8080/health
          docker exec nova-db pg_dump -U postgres -Fc -f /tmp/nova.dump nova
          docker exec nova-db createdb -U postgres nova_restore
          docker exec nova-db pg_restore -U postgres --exit-on-error -d nova_restore /tmp/nova.dump
          test "$(docker exec nova-db psql -U postgres -d nova_restore -tAc 'SELECT COUNT(*) FROM "Character"')" = 12
          docker restart nova-api
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/ready; then exit 0; fi
            sleep 2
          done
          docker logs nova-api
          exit 1

  # Publishes an installable APK at a permanent link after every fully green push to main:
  # https://github.com/<owner>/<repo>/releases/download/nova-preview/NOVA-AI-FINAL.apk
  # Signed with the committed TEST key (android/keystore) so each build installs as an update.
  publish_preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, android, android_ui, docker_image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NOVA_API_BASE_URL: ${{ vars.NOVA_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build test-signed release APK
        run: cd android && gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify signature, package and embedded API URL
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee signing.txt
          grep -q "NOVA AI Test Build" signing.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -E "package:|launchable-activity" | tee badging.txt
          cp "$APK" NOVA-AI-FINAL.apk
          git archive --format=zip --output=NOVA-AI-FULL-SOURCE.zip HEAD
      - name: Publish to the nova-preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="${NOVA_API_BASE_URL:-$(cat android/nova-api-url.txt 2>/dev/null)}"
          {
            echo "**Тестовая сборка NOVA AI** · коммит \`${GITHUB_SHA::7}\` · CI #${GITHUB_RUN_NUMBER}"
            echo
            echo "- Подпись: **тестовый ключ** (не production, не для Google Play). Новые сборки ставятся поверх как обновление."
            if [ -n "$URL" ]; then echo "- Сервер: \`$URL\`"; else echo "- Сервер: **ещё не подключён** — приложение установится, но вход и чат заработают после развёртывания backend."; fi
            echo "- Все проверки CI (сервер, Android, UI-тесты на эмуляторе, Docker) пройдены перед публикацией."
            echo
            echo "Установка: скачай \`NOVA-AI-FINAL.apk\` на телефон и открой. Android попросит разрешить установку из этого источника."
          } > notes.md
          gh release delete nova-preview --yes --cleanup-tag || true
          gh release create nova-preview NOVA-AI-FINAL.apk NOVA-AI-FULL-SOURCE.zip --prerelease \
            --target "$GITHUB_SHA" --title "NOVA AI — тестовая сборка" --notes-file notes.md
