name: Live check

# Scheduled uptime and commit-bound release validation are reported as separate jobs.
on:
  push:
    branches: [main]
    paths: ['backend/**', 'scripts/live-smoke.mjs', '.github/workflows/live.yml', 'android/nova-api-url.txt', 'android/app/src/androidTest/java/ai/nova/app/NovaLiveAuthTest.kt']
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 'Expected Render commit SHA (defaults to the selected ref SHA)'
        required: false
        type: string
  # Daily monitoring run (GitHub e-mails the owner when a scheduled run fails). Once a day keeps the
  # free Render/Neon/AI quotas essentially untouched.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

defaults:
  run:
    shell: bash
concurrency:
  group: nova-live-${{ github.event_name == 'schedule' && 'uptime' || 'release' }}
  cancel-in-progress: false

jobs:
  uptime:
    if: github.event_name == 'schedule'
    name: Uptime (health, readiness and deployed version)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check availability and report stale deployments
        run: |
          URL="$(tr -d '[:space:]' < android/nova-api-url.txt)"
          node scripts/live-smoke.mjs "$URL" "$GITHUB_SHA" --uptime | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    if: github.event_name != 'schedule'
    name: Release validation (expected deployed commit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the deployed release against live services
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          URL="$(tr -d '[:space:]' < android/nova-api-url.txt)"
          node scripts/live-smoke.mjs "$URL" "${EXPECTED_COMMIT:-$GITHUB_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"

  android-live:
    name: Android E2E (expected deployed commit)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/android-live.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-live-evidence
          path: |
            android/app/build/outputs/androidTest-results
            android/app/build/reports/androidTests
            android-live-screenshots
